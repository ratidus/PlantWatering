name: PlantWatering CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print author information
        shell: pwsh
        run: |
          Write-Host "============================================="
          Write-Host "Проєкт: PlantWatering"
          Write-Host "Автор: Кученьов Ілля Дмитрович, ст. гр. КВ-42"
          Write-Host "КПІ ім. Ігоря Сікорського, ФПМ, каф. СПСКС"
          Write-Host "============================================="

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Install PyInstaller and build executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --windowed --paths . --name PlantWatering src/app.py

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag dist/PlantWatering.exe `
            --title "PlantWatering $tag" `
            --notes "Автоматична збірка та реліз ПЗ PlantWatering (Автор: Кученьов І.Д., ст. гр. КВ-42)."
